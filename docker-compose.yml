# Docker Compose for Local Development
# This ensures developers use local databases instead of production/staging

services:
  postgres:
    image: postgres:17
    container_name: conquestk-postgres
    environment:
      POSTGRES_DB: conquestk_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: conquestk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  matchsvc:
    build:
      context: ./services/matchsvc
    container_name: conquestk-matchsvc
    environment:
      - REDIS_URL=redis://redis:6379
      - MATCHSVC_PORT=8085
      - MATCHSVC_DISABLE_AUTH=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8085:8085"

volumes:
  postgres_data:
    name: conquestk-postgres-data
  redis_data:
    name: conquestk-redis-data
# Usage:
# 1. Start services: docker-compose up -d
# 2. Stop services: docker-compose down
# 3. Reset database: docker-compose down -v && docker-compose up -d
# 4. View logs: docker-compose logs -f [service_name]
