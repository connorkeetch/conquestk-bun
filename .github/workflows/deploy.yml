name: ConquestK CI & Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

env:
  NODE_VERSION: '24.x'

jobs:
  # -------------------------------------------------------------------
  # CI Pipeline: Code Quality & Testing
  # -------------------------------------------------------------------

  typecheck:
    name: TypeScript Type Checking
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
            shared/node_modules
            shared/wasm-odds/node_modules
            shared/match-client/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

  lint:
    name: Linting (Biome)
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
            shared/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run Biome linter
        run: npm run lint

  format-check:
    name: Format Check (Biome)
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
            shared/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npx biome format .

  frontend-strict:
    name: Frontend Strict TypeCheck
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
            shared/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Frontend strict optional typecheck
        run: npm run typecheck:frontend:strict

  unit-tests:
    name: Unit Tests (Backend + Frontend)
    runs-on: ubuntu-latest
    needs: typecheck

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: risk_game_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: REMOVED_COMMITTED_CREDENTIAL
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
            shared/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test:backend
        env:
          DATABASE_URL: postgresql://USER:PASSWORD@HOST:PORT/DATABASE
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-minimum-32-characters
          SESSION_SECRET: test-session-secret-minimum-32-characters
          NODE_ENV: test

      - name: Run frontend tests
        run: npm run test:frontend

  schema-check:
    name: Database Schema Validation
    runs-on: ubuntu-latest
    needs: typecheck

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: risk_game_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: REMOVED_COMMITTED_CREDENTIAL
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
            shared/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://USER:PASSWORD@HOST:PORT/DATABASE
          NODE_ENV: test

      - name: Check database schema
        working-directory: backend
        run: npm run check:schema
        env:
          DATABASE_URL: postgresql://USER:PASSWORD@HOST:PORT/DATABASE
          NODE_ENV: test

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: [lint, format-check, unit-tests, frontend-strict, schema-check]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
            shared/node_modules
            shared/wasm-odds/node_modules
            shared/match-client/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build
        env:
          DATABASE_URL: postgresql://USER:PASSWORD@HOST:PORT/DATABASE
          JWT_SECRET: test-jwt-secret-minimum-32-characters
          SESSION_SECRET: test-session-secret-minimum-32-characters
          NODE_ENV: production

  e2e-smoke:
    name: E2E Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, format-check, unit-tests, frontend-strict, schema-check]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
            shared/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E smoke tests
        run: npx playwright test --config=playwright.config.ts
        env:
          CI: true

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # -------------------------------------------------------------------
  # Deployment Pipeline
  # -------------------------------------------------------------------

  deploy-staging:
    name: Deploy to Staging (dev.conquestk.com)
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: [typecheck, lint, format-check, unit-tests, frontend-strict, schema-check, build, e2e-smoke]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://dev.conquestk.com

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Railway deployment
        run: |
          curl -X POST ${{ secrets.RAILWAY_STAGING_WEBHOOK }}

      - name: Wait for deployment
        run: sleep 45

      - name: Health check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://dev.conquestk.com/health)
          if [ "$response" -eq 200 ]; then
            echo "✅ Staging deployment successful!"
          else
            echo "❌ Staging health check failed with status: $response"
            exit 1
          fi

  deploy-production:
    name: Deploy to Production (conquestk.com)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [typecheck, lint, format-check, unit-tests, frontend-strict, schema-check, build, e2e-smoke]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://conquestk.com

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Railway deployment
        run: |
          curl -X POST ${{ secrets.RAILWAY_PRODUCTION_WEBHOOK }}

      - name: Wait for deployment
        run: sleep 60

      - name: Health check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://conquestk.com/health)
          if [ "$response" -eq 200 ]; then
            echo "✅ Production deployment successful!"
          else
            echo "❌ Production health check failed with status: $response"
            exit 1
          fi

      - name: Create deployment tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "deploy-$(date +%Y%m%d-%H%M%S)" -m "Production deployment - commit ${{ github.sha }}"
          git push origin --tags
