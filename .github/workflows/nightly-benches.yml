name: nightly-benches

on:
  schedule:
    - cron: '30 3 * * *' # run daily at 03:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-benches
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package (for odds facade)
        run: npm run build:shared

      - name: Build WASM (ensure artifacts present)
        run: npm run odds:build

      - name: Run battle bench (TS vs WASM)
        run: |
          BENCH_N=10000 node scripts/bench-odds.js --quiet || BENCH_N=10000 node scripts/bench-odds.js

      - name: Run Monte Carlo bench (TS vs WASM)
        run: |
          MC_TRIALS=50000 node scripts/bench-odds-mc.js --quiet || MC_TRIALS=50000 node scripts/bench-odds-mc.js

      - name: Update docs with latest bench results
        run: node scripts/update-odds-bench-docs.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(bench): update nightly bench results [skip ci]"
          title: "chore(bench): nightly bench results"
          body: "Automated update of docs/bench and benchmark docs."
          branch: chore/nightly-bench-results
          delete-branch: true
          add-paths: |
            docs/bench/*
            docs/tech/odds-engine.md
