name: Odds Engine CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: '24.x'

jobs:
  odds-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: rustfmt, clippy

      - name: Setup wasm-pack (latest)
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Show wasm-pack version
        run: |
          wasm-pack --version || true

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build WASM package
        run: npm run odds:build

      - name: Rust format check
        working-directory: shared/wasm-odds/crate
        run: cargo fmt --all -- --check

      - name: Clippy lint (deny warnings)
        working-directory: shared/wasm-odds/crate
        run: cargo clippy --all-targets -- -D warnings

      - name: Run odds tests (Rust + TS)
        run: npm run odds:test

      - name: Run odds benchmark (main branch only)
        if: github.ref == 'refs/heads/main'
        run: npm run odds:bench

      - name: Commit updated benchmark docs
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet docs/tech/odds-engine.md; then
            echo "No doc changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tech/odds-engine.md docs/bench/bench-*.json || true
          git commit -m "docs(odds): update latest benchmark results [skip ci]"
          git push
