<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111827; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f8fafc; }
    }
  </style>
  <!-- Background with rounded corners for maskable icons -->
  <rect class="bg" width="192" height="192" rx="20" />
  <!-- Embed the new brand SVG, center-cropped to square -->
  <image href="/Conquest_K_Logo.svg" x="0" y="0" width="192" height="192" preserveAspectRatio="xMidYMid slice" />
</svg>
