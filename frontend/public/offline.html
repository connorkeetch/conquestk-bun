<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />
    <title>Conquest K – Offline</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0f172a; color: #e5e7eb; }
      .wrap { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
      .card { background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; max-width: 520px; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 8px; line-height: 1.45; color: #cbd5e1; }
      .hint { font-size: 13px; opacity: 0.8; }
      a { color: #93c5fd; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>You're offline</h1>
        <p>
          Conquest K can't reach the network. Some pages and assets may still load from cache.
        </p>
        <p class="hint">Try reconnecting, then reload this page.</p>
      </div>
    </div>
  </body>
  </html>
