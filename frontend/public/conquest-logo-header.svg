<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">ConquestK mountain logo</title>
  <defs>
    <linearGradient id="mountainGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1F2937" />
      <stop offset="70%" style="stop-color:#4B5563" />
      <stop offset="100%" style="stop-color:#9CA3AF" />
    </linearGradient>
  </defs>

  <!-- Jagged Lone Peak profile (matches header component) -->
  <path d="M 8 52 
           L 16 38
           L 20 40
           L 24 34
           L 26 30
           L 28 26
           L 29 22
           L 30 18
           L 31 22
           L 32 26
           L 34 30
           L 36 34
           L 40 40
           L 44 38
           L 52 52
           Z"
        fill="url(#mountainGradient)" />

  <!-- Subtle ridge lines for texture -->
  <line x1="30" y1="18" x2="28" y2="38" stroke="#1F2937" stroke-width="0.5" opacity="0.4" />
  <line x1="30" y1="18" x2="32" y2="38" stroke="#1F2937" stroke-width="0.5" opacity="0.4" />

  <!-- Minimal snow -->
  <path d="M 30 18 L 33 24 L 30 22 L 27 24 Z" fill="#FFFFFF" opacity="0.85" />

  <!-- Flag pole -->
  <line x1="30" y1="18" x2="30" y2="9" stroke="#4B5563" stroke-width="1.5" />

  <!-- Waving flag (brand accent red; matches default theme var --color-accent) -->
  <path d="M 30 9 Q 36 11, 39 9 L 39 14 Q 36 16, 30 13 Z" fill="#dc2626" />

  <!-- K on flag -->
  <text x="34" y="12.5" font-family="Arial, Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#FFFFFF">K</text>
</svg>

