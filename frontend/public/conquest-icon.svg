<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loneGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0F1117" />
      <stop offset="70%" style="stop-color:#374151" />
      <stop offset="100%" style="stop-color:#6B7280" />
    </linearGradient>
  </defs>
  
  <!-- Jagged Lone Peak profile (scaled up for 64x64) -->
  <path d="M 8 55 
           L 17 40
           L 22 42
           L 26 36
           L 28 32
           L 30 28
           L 31 24
           L 32 20
           L 33 24
           L 34 28
           L 36 32
           L 38 36
           L 42 42
           L 47 40
           L 56 55
           Z" 
        fill="url(#loneGrad)"/>
  
  <!-- Subtle ridge lines for texture -->
  <line x1="32" y1="20" x2="30" y2="40" stroke="#1F2937" stroke-width="0.5" opacity="0.4"/>
  <line x1="32" y1="20" x2="34" y2="40" stroke="#1F2937" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Minimal snow -->
  <path d="M 32 20 L 35 26 L 32 24 L 29 26 Z" fill="white" opacity="0.85"/>
  
  <!-- Flag pole -->
  <line x1="32" y1="20" x2="32" y2="10" stroke="#4B5563" stroke-width="2"/>
  
  <!-- Waving flag (red) -->
  <path d="M 32 10 Q 38 12, 42 10 L 42 16 Q 38 18, 32 15 Z" fill="#E74C3C"/>
  
  <!-- K on flag -->
  <text x="36" y="14" font-family="Arial" font-size="4" font-weight="bold" fill="white">K</text>
</svg>