<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/conquest-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <title>Conquest K</title>
    <script>
      // Load theme immediately to prevent flash
      ;(function () {
        try {
          const validThemes = [
            'default',
            'dark',
            'light',
            'retrospace',
            // Light/Dark variants for color families
            'violet-dark',
            'violet-light',
            'blue-dark',
            'blue-light',
            'red-dark',
            'red-light',
            'green-dark',
            'green-light',
            'frontier',
            'black',
            'highcontrast',
            'halloween',
            'metal',
            'cutlers-cheese',
          ]
          let storedTheme = localStorage.getItem('colorTheme') || 'default'
          // Migrate legacy single-variant color themes to their dark variants
          const legacyMap = {
            violet: 'violet-dark',
            blue: 'blue-dark',
            red: 'red-dark',
            green: 'green-dark',
          }
          if (legacyMap[storedTheme]) {
            storedTheme = legacyMap[storedTheme]
            try { localStorage.setItem('colorTheme', storedTheme) } catch {}
          }
          
          // Validate and apply theme
          const theme = validThemes.includes(storedTheme) ? storedTheme : 'default'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          // Silently fail if localStorage is not available
          document.documentElement.setAttribute('data-theme', 'default')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for push notifications
      if ('serviceWorker' in navigator && 'PushManager' in window) {
        navigator.serviceWorker
          .register('/sw.js')
          .then((registration) => {
            console.log('Service Worker registered:', registration)
          })
          .catch((error) => {
            console.error('Service Worker registration failed:', error)
          })
      }
    </script>
  </body>
</html>
