<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/conquest-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Self-hosted fonts are imported via CSS (Fontsource) -->
    <meta name="theme-color" content="#2563EB" />
    <title>Conquest K</title>
    <script>
      // Load theme immediately to prevent flash
      ;(function () {
        const getCookie = (name) => {
          try {
            const value = `; ${document.cookie}`
            const parts = value.split(`; ${name}=`)
            if (parts.length === 2) return parts.pop().split(';').shift()
          } catch {}
          return null
        }
        const isDebug = () => {
          try {
            if (localStorage.getItem('themeDebug') === '1') return true
          } catch {}
          return getCookie('ck_theme_debug') === '1'
        }

        const log = (msg, data) => {
          if (isDebug()) {
            try { console.info('[theme-loader]', msg, data || '') } catch {}
          }
        }

        try {
          const validThemes = [
            'default',
            'dark',
            'light',
            'retrospace',
            // Light/Dark variants for color families
            'violet-dark',
            'violet-light',
            'blue-dark',
            'blue-light',
            'red-dark',
            'red-light',
            'green-dark',
            'green-light',
            'frontier',
            'black',
            'highcontrast',
            'halloween',
            'metal',
            'cutlers-cheese',
          ]

          let storedTheme = null
          try {
            storedTheme = localStorage.getItem('colorTheme') || 'default'
          } catch (err) {
            // localStorage unavailable; we'll try cookie below
            log('localStorage read failed; will try cookie', String(err))
          }

          // Migrate legacy single-variant color themes to their dark variants
          const legacyMap = {
            violet: 'violet-dark',
            blue: 'blue-dark',
            red: 'red-dark',
            green: 'green-dark',
          }
          if (storedTheme && legacyMap[storedTheme]) {
            storedTheme = legacyMap[storedTheme]
            try { localStorage.setItem('colorTheme', storedTheme) } catch {}
            log('migrated legacy theme to variant', storedTheme)
          }

          // Validate and apply theme; try cookie fallback before defaulting
          let theme = null
          if (storedTheme && validThemes.includes(storedTheme)) {
            theme = storedTheme
          } else {
            const cookieTheme = getCookie('ck_theme')
            if (cookieTheme && validThemes.includes(cookieTheme)) {
              theme = cookieTheme
              log('using cookie fallback theme', theme)
            } else {
              theme = 'default'
              log('falling back to default theme', theme)
            }
          }

          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          // Silently fail if localStorage/cookie is not available
          document.documentElement.setAttribute('data-theme', 'default')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
